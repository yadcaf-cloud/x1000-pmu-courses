name: X1000 PMU COURSES - Preparation V63

run-name: X1000 PMU COURSES V63 - Controle isole

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/x1000-pmu-courses.yml"
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/x1000-pmu-courses.yml"
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: x1000-v63-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: X1000 V63 - Diagnostic et integrite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      X1000_PROJECT: x1000-pmu-courses
      X1000_VERSION: V63
      X1000_DIAGNOSTIC_ONLY: "1"
      X1000_DISABLE_WRITES: "1"
      X1000_PRODUCTION_PORT: "8765"
      X1000_TEST_PORT: "18765"
      X1000_DISABLE_BETS: "1"
      X1000_DISABLE_FIGE: "1"
      X1000_DISABLE_DEPLOY: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier le depot et preparer les rapports
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-pmu-courses"
          test -d .git
          python --version
          git rev-parse HEAD
          mkdir -p "$RUNNER_TEMP/x1000-v63"

      - name: Executer le diagnostic V63
        env:
          REPORT_DIR: ${{ runner.temp }}/x1000-v63
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import socket
          import subprocess
          import sys
          import tempfile
          import urllib.request
          import urllib.error

          ROOT = pathlib.Path.cwd().resolve()
          OUT = pathlib.Path(
              os.environ["REPORT_DIR"]
          ).resolve()
          OUT.mkdir(parents=True, exist_ok=True)

          EXCLUDED = {
              ".git", ".venv", "venv",
              "__pycache__", ".pytest_cache",
              ".tox", "node_modules",
              ".mypy_cache"
          }

          PROTECTED = (
              "fige", "figé", "archive",
              "pronostic", "selection",
              "audit", "resultat"
          )

          ROUTES = [
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits"
          ]

          CENTRAL_NAMES = {
              "central.py",
              "coordination_x1000.py",
              "integration_x1000.py",
              "coordinateur.py",
              "orchestrateur.py"
          }

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(65536),
                      b""
                  ):
                      h.update(block)
              return h.hexdigest()

          def inventory(root):
              result = {}
              for directory, dirs, files in os.walk(
                  root, followlinks=False
              ):
                  dirs[:] = [
                      d for d in dirs
                      if d not in EXCLUDED
                      and not (
                          pathlib.Path(directory) / d
                      ).is_symlink()
                  ]
                  for filename in files:
                      p = pathlib.Path(directory) / filename
                      if not p.is_file() or p.is_symlink():
                          continue
                      rel = p.relative_to(root).as_posix()
                      result[rel] = digest(p)
              return result

          def protected(path):
              return any(
                  word in path.lower()
                  for word in PROTECTED
              )

          def command(args, cwd, timeout=20, env=None):
              try:
                  p = subprocess.run(
                      args,
                      cwd=cwd,
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                      check=False,
                      env=env
                  )
                  return {
                      "exit_code": p.returncode,
                      "stdout": p.stdout[-3000:],
                      "stderr": p.stderr[-3000:]
                  }
              except Exception as exc:
                  return {
                      "exit_code": None,
                      "error": str(exc)
                  }

          def status(items):
              if not items:
                  return "absent"
              if len(items) == 1:
                  return "candidate_unique"
              return "ambiguous"

          before = inventory(ROOT)
          protected_before = {
              k: v for k, v in before.items()
              if protected(k)
          }

          report = {
              "project": "X1000 PMU COURSES",
              "version": "V63",
              "timestamp_utc":
                  datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat(),
              "repository": os.environ.get(
                  "GITHUB_REPOSITORY"
              ),
              "mode": "isolated_diagnostic",
              "production_port": 8765,
              "production_port_tested": False,
              "temporary_port": 18765,
              "engines": {},
              "central": {},
              "syntax": {},
              "api": {},
              "sources": {},
              "dependencies": {},
              "backup": {},
              "integrity": {},
              "rollback": {},
              "git": {},
              "warnings": [],
              "errors": []
          }

          report["git"]["before"] = command(
              ["git", "status", "--porcelain"],
              ROOT
          )
          report["git"]["head"] = command(
              ["git", "rev-parse", "HEAD"],
              ROOT
          )

          # Sauvegarde de controle hors depot.
          # Les donnees protegees restent intactes.
          backup_dir = OUT / "backup-manifest"
          backup_dir.mkdir(exist_ok=True)

          manifest = {
              "files": before,
              "protected": protected_before
          }

          backup_file = backup_dir / "manifest.json"
          backup_file.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          report["backup"] = {
              "manifest": str(backup_file),
              "sha256": digest(backup_file),
              "type": "hash_manifest",
              "full_file_backup": False,
              "protected_files_copied": False,
              "note": (
                  "Empreintes de controle uniquement; "
                  "aucune copie des donnees protegees"
              )
          }

          # Analyse syntaxique sans import applicatif.
          pyfiles = sorted(
              p for p in before
              if p.endswith(".py")
          )
          trees = {}

          for path in pyfiles:
              try:
                  source = (ROOT / path).read_text(
                      encoding="utf-8-sig"
                  )
                  trees[path] = ast.parse(
                      source, filename=path
                  )
                  report["syntax"][path] = "OK"
              except Exception as exc:
                  report["syntax"][path] = str(exc)
                  report["errors"].append(
                      "Syntaxe invalide: " + path
                  )

          # Identifier les contrats de chaque moteur.
          for number in range(1, 6):
              name = f"M{number}"
              pattern = re.compile(
                  rf"(?<![a-z0-9])m{number}"
                  rf"(?![a-z0-9])",
                  re.IGNORECASE
              )

              candidates = [
                  p for p in pyfiles
                  if pattern.search(p)
              ]

              contracts = {}
              for path in candidates:
                  tree = trees.get(path)
                  if tree is None:
                      continue

                  contracts[path] = {
                      "functions": [
                          n.name for n in tree.body
                          if isinstance(
                              n, (
                                  ast.FunctionDef,
                                  ast.AsyncFunctionDef
                              )
                          )
                      ],
                      "classes": [
                          n.name for n in tree.body
                          if isinstance(n, ast.ClassDef)
                      ],
                      "self_test_declared":
                          any(
                              isinstance(n, ast.Constant)
                              and n.value == "--self-test"
                              for n in ast.walk(tree)
                          )
                  }

              report["engines"][name] = {
                  "candidates": candidates,
                  "status": status(candidates),
                  "contracts": contracts,
                  "executed": False,
                  "validated": False,
                  "reason": (
                      "Execution conditionnelle "
                      "en environnement isole"
                  )
              }

          # Noyau central.
          central = [
              p for p in pyfiles
              if pathlib.Path(p).name.lower()
              in CENTRAL_NAMES
          ]

          report["central"] = {
              "candidates": central,
              "status": status(central),
              "executed": False,
              "validated": False
          }

          # Inventaire des routes API.
          declared_routes = {}
          api_files = set()
          asgi_candidates = []

          for path, tree in trees.items():
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      if any(
                          isinstance(t, ast.Name)
                          and t.id == "app"
                          for t in node.targets
                      ):
                          if isinstance(node.value, ast.Call):
                              fn = node.value.func
                              if (
                                  isinstance(fn, ast.Name)
                                  and fn.id in {
                                      "FastAPI", "Starlette"
                                  }
                              ):
                                  asgi_candidates.append(path)

                  if not isinstance(
                      node, (
                          ast.FunctionDef,
                          ast.AsyncFunctionDef
                      )
                  ):
                      continue

                  for dec in node.decorator_list:
                      if not isinstance(dec, ast.Call):
                          continue
                      if not isinstance(
                          dec.func, ast.Attribute
                      ):
                          continue
                      if dec.func.attr.lower() not in {
                          "get", "post", "put",
                          "delete", "patch",
                          "route", "api_route"
                      }:
                          continue
                      if not dec.args:
                          continue

                      arg = dec.args[0]
                      if (
                          isinstance(arg, ast.Constant)
                          and isinstance(arg.value, str)
                      ):
                          api_files.add(path)
                          declared_routes.setdefault(
                              arg.value, []
                          ).append({
                              "file": path,
                              "handler": node.name,
                              "method": dec.func.attr
                          })

          report["api"] = {
              "files": sorted(api_files),
              "declared_routes": declared_routes,
              "expected_routes": ROUTES,
              "route_presence": {
                  r: r in declared_routes
                  for r in ROUTES
              },
              "asgi_candidates": sorted(
                  set(asgi_candidates)
              ),
              "http_tested": False,
              "http_results": {},
              "asgi_tested": False
          }

          # Inventaire des sources hippiques.
          domains = set()
          domain_pattern = re.compile(
              r"https?://([a-zA-Z0-9.-]+)"
          )

          for path in pyfiles:
              content = (ROOT / path).read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              domains.update(
                  domain_pattern.findall(content)
              )

          report["sources"] = {
              "declared_domains": sorted(domains),
              "authorized_domains": [],
              "authorization_verified": False,
              "http_tested": False,
              "reason": (
                  "Liste blanche non fournie; "
                  "aucun acces distant automatique"
              )
          }

          # Dependances detectees.
          manifests = sorted(
              p for p in before
              if (
                  pathlib.Path(p).name.startswith(
                      "requirements"
                  )
                  and p.endswith(".txt")
              )
              or pathlib.Path(p).name == (
                  "pyproject.toml"
              )
          )

          report["dependencies"] = {
              "manifests": manifests,
              "installed": False,
              "reason": (
                  "Aucune installation arbitraire "
                  "de dependances applicatives"
              )
          }

          # Creer un environnement de test isole.
          # Ne jamais utiliser le repertoire original
          # comme espace d'execution.
          with tempfile.TemporaryDirectory(
              prefix="x1000-v63-"
          ) as temporary:
              sandbox = pathlib.Path(temporary)
              workspace = sandbox / "project"
              workspace.mkdir()

              # Copie uniquement des fichiers Python
              # non proteges et des manifestes.
              copied = []
              for rel in sorted(
                  set(pyfiles + manifests)
              ):
                  if protected(rel):
                      continue
                  src = ROOT / rel
                  dst = workspace / rel
                  dst.parent.mkdir(
                      parents=True, exist_ok=True
                  )
                  shutil.copy2(src, dst)
                  copied.append(rel)

              test_env = os.environ.copy()
              test_env.update({
                  "HOME": str(sandbox),
                  "TMPDIR": str(sandbox),
                  "XDG_CACHE_HOME": str(
                      sandbox / "cache"
                  ),
                  "X1000_DIAGNOSTIC_ONLY": "1",
                  "X1000_DISABLE_WRITES": "1",
                  "X1000_DISABLE_BETS": "1",
                  "X1000_DISABLE_FIGE": "1",
                  "X1000_DISABLE_DEPLOY": "1",
                  "X1000_PRODUCTION_PORT": "8765",
                  "X1000_TEST_PORT": "18765",
                  "PYTHONDONTWRITEBYTECODE": "1"
              })

              report["sandbox"] = {
                  "enabled": True,
                  "files_copied": copied,
                  "protected_files_copied": False,
                  "network_isolation_enforced": False
              }

              # Execution uniquement si le contrat
              # --self-test est explicitement detecte.
              for name, data in report["engines"].items():
                  if len(data["candidates"]) != 1:
                      continue

                  path = data["candidates"][0]
                  contract = data["contracts"].get(
                      path, {}
                  )

                  if not contract.get(
                      "self_test_declared", False
                  ):
                      data["reason"] = (
                          "Contrat --self-test absent"
                      )
                      continue

                  if protected(path):
                      data["reason"] = (
                          "Chemin protege; test ignore"
                      )
                      continue

                  # Les imports ou effets de bord ne
                  # sont pas prouves sans danger par AST.
                  # Execution automatique des moteurs
                  # desactivee jusqu'a validation du
                  # contrat exact.
                  data["reason"] = (
                      "Self-test detecte mais execution "
                      "non autorisee sans audit "
                      "des effets de bord"
                  )

              # Le central est inventorie, mais
              # n'est pas lance arbitrairement.
              report["central"]["reason"] = (
                  "Contrat d'execution a valider "
                  "avant tout lancement"
              )

              # Controle du port temporaire.
              try:
                  with socket.socket(
                      socket.AF_INET,
                      socket.SOCK_STREAM
                  ) as sock:
                      sock.bind(
                          ("127.0.0.1", 18765)
                      )
                  report["api"][
                      "temporary_port_ok"
                  ] = True
              except OSError as exc:
                  report["api"][
                      "temporary_port_ok"
                  ] = False
                  report["warnings"].append(
                      "Port temporaire: " + str(exc)
                  )

              # Test HTTP seulement si une application
              # ASGI unique est identifiee et que ses
              # dependances sont disponibles.
              asgi = sorted(set(asgi_candidates))
              if len(asgi) != 1:
                  report["api"]["http_reason"] = (
                      "Application ASGI absente "
                      "ou ambigue"
                  )
              elif protected(asgi[0]):
                  report["api"]["http_reason"] = (
                      "Application situee dans "
                      "un chemin protege"
                  )
              else:
                  # Aucun import dynamique sans
                  # verification des effets de bord.
                  report["api"]["http_reason"] = (
                      "ASGI identifiee; lancement "
                      "differe jusqu'a validation "
                      "des imports et dependances"
                  )

          # Verification finale du depot original.
          after = inventory(ROOT)
          protected_after = {
              k: v for k, v in after.items()
              if protected(k)
          }

          protected_ok = (
              protected_before == protected_after
          )
          repository_ok = before == after

          report["integrity"] = {
              "protected_unchanged": protected_ok,
              "repository_unchanged": repository_ok,
              "files_before": len(before),
              "files_after": len(after),
              "protected_count": len(
                  protected_before
              ),
              "protected_hashes_before":
                  protected_before,
              "protected_hashes_after":
                  protected_after
          }

          report["rollback"] = {
              "required": not repository_ok,
              "performed": False,
              "available": False,
              "reason": (
                  "Diagnostic sans modification "
                  "intentionnelle du depot; "
                  "aucune restauration automatique"
              )
          }

          report["git"]["after"] = command(
              ["git", "status", "--porcelain"],
              ROOT
          )

          if not protected_ok:
              report["errors"].append(
                  "Integrite des donnees protegees"
              )

          if not repository_ok:
              report["errors"].append(
                  "Depot modifie pendant le diagnostic"
              )

          if (
              report["git"]["before"].get("stdout")
              != report["git"]["after"].get("stdout")
          ):
              report["errors"].append(
                  "Etat Git modifie"
              )

          # Export des rapports.
          output = OUT / "rapport-v63.json"
          output.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          checksum = OUT / "rapport-v63.sha256"
          checksum.write_text(
              digest(output)
              + "  rapport-v63.json\n",
              encoding="utf-8"
          )

          summary = [
              "X1000 PMU COURSES V63",
              "Depot: x1000-pmu-courses",
              "Python: 3.11",
              "Port production: 8765 preserve",
              "Port test: 18765",
              "",
              "MOTEURS"
          ]

          for name, data in report["engines"].items():
              summary.append(
                  f"{name}: {data['status']} "
                  f"(execute={data['executed']})"
              )

          summary.extend([
              "",
              "CENTRAL",
              report["central"]["status"],
              "",
              "API"
          ])

          for route, present in (
              report["api"]["route_presence"].items()
          ):
              summary.append(
                  f"{route}: "
                  + (
                      "DECLAREE" if present
                      else "NON DETECTEE"
                  )
              )

          summary.extend([
              "",
              "INTEGRITE",
              f"Proteges inchanges: {protected_ok}",
              f"Depot inchange: {repository_ok}",
              "",
              "Aucun commit automatique",
              "Aucun push automatique",
              "Aucun deploiement",
              "Aucun FIGE genere",
              "Aucune archive modifiee",
              "",
              f"Rapport: {output}"
          ])

          summary_file = OUT / "resume-v63.txt"
          summary_file.write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8"
          )

          print("\n".join(summary))

          if report["errors"]:
              for error in report["errors"]:
                  print("::error::" + error)
              sys.exit(1)

          print("DIAGNOSTIC V63 TERMINE")
          PY

      - name: Verifier les empreintes des rapports
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/x1000-v63
        run: |
          set -euo pipefail
          cd "$REPORT_DIR"
          if [ -f rapport-v63.sha256 ]; then
            sha256sum -c rapport-v63.sha256
          else
            echo "Rapport indisponible"
          fi

      - name: Publier les rapports V63
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-pmu-courses-v63
          path: ${{ runner.temp }}/x1000-v63/
          if-no-files-found: warn
          retention-days: 14

      - name: Resume GitHub Actions
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/x1000-v63
        run: |
          {
            echo "## X1000 PMU COURSES V63"
            echo ""
            echo "Diagnostic de preparation controlee."
            echo ""
            if [ -f "$REPORT_DIR/resume-v63.txt" ]; then
              echo '```text'
              cat "$REPORT_DIR/resume-v63.txt"
              echo '```'
            else
              echo "Diagnostic incomplet."
            fi
            echo ""
            echo "### Protections"
            echo "- Port production 8765 non sollicite"
            echo "- Pronostics et FIGEs preserves"
            echo "- Archives preservees"
            echo "- Aucun commit ou push automatique"
            echo "- Aucun deploiement"
          } >> "$GITHUB_STEP_SUMMARY"
