name: X1000 PMU COURSES - Audit V73

run-name: Audit V73 - M1 M5 API et securite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-audit-v73-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit general avant Render
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      X1000_SOURCE_URL: ""
      X1000_ALLOWED_HOSTS: ""
      X1000_CORS_ORIGINS: ""
      X1000_ANALYZE_ENABLED: "0"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier le depot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-pmu-courses"

          for f in \
            api.py \
            moteurs.py \
            moteurs_v65.py \
            coordination_x1000.py \
            collecte_pmu.py \
            validation_pmu.py \
            integration_x1000.py \
            requirements.txt \
            index.html
          do
            test -f "$f"
            test ! -L "$f"
            echo "OK: $f"
          done

      - name: Preparer les dependances
        run: |
          python -m venv /tmp/x1000-audit-venv
          /tmp/x1000-audit-venv/bin/python \
            -m pip install -r requirements.txt

      - name: Verifier la syntaxe
        run: |
          /tmp/x1000-audit-venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          fichiers = [
              "api.py",
              "moteurs.py",
              "moteurs_v65.py",
              "coordination_x1000.py",
              "collecte_pmu.py",
              "validation_pmu.py",
              "integration_x1000.py",
          ]

          for fichier in fichiers:
              ast.parse(
                  Path(fichier).read_text(
                      encoding="utf-8"
                  ),
                  filename=fichier
              )
              print("SYNTAXE OK:", fichier)
          PY

      - name: Tester les imports et moteurs
        run: |
          /tmp/x1000-audit-venv/bin/python - <<'PY'
          import api
          import moteurs
          import moteurs_v65
          import coordination_x1000
          import collecte_pmu
          import validation_pmu
          import integration_x1000

          noms = [m.nom for m in moteurs.MOTEURS]

          assert len(noms) == 5
          assert set(noms) == {
              "M1", "M2", "M3", "M4", "M5"
          }

          for moteur in moteurs.MOTEURS:
              assert callable(moteur.analyser)

          print("IMPORTS ET INTERFACES OK")
          PY

      - name: Tester les cinq moteurs en isolation
        run: |
          /tmp/x1000-audit-venv/bin/python - <<'PY'
          from moteurs import MOTEURS
          from coordination_x1000 import coordonner

          course = {
              "id": "TEST-ISOLE-V73",
              "hippodrome": "TEST",
              "donnees_verifiees": False,
              "partants": [
                  {
                      "numero": n,
                      "non_partant": False
                  }
                  for n in range(1, 7)
              ]
          }

          for moteur in MOTEURS:
              resultat = moteur.analyser(course)
              assert resultat["classement"] == []
              assert resultat["pari"] is None
              assert resultat["fige"] is False
              assert resultat["statut"] != \
                  "ANALYSE_VALIDEE"
              print("MOTEUR OK:", moteur.nom)

          central = coordonner(course)
          assert central["classement"] == []
          assert central["pari"] is None
          assert central["fige"] is False

          print("COORDINATION OK")
          PY

      - name: Tester les routes API
        run: |
          /tmp/x1000-audit-venv/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          routes = [
              "/health",
              "/api/status",
              "/api/engines",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/analyze",
          ]

          with TestClient(app) as client:
              for route in routes:
                  response = client.get(route)
                  assert response.status_code == 200, (
                      route, response.status_code
                  )
                  print("ROUTE OK:", route)

              response = client.post(
                  "/api/analyze",
                  json={
                      "course": {
                          "id": "TEST",
                          "partants": []
                      }
                  }
              )
              assert response.status_code == 503

          print("API EN LECTURE CONTROLEE OK")
          PY

      - name: Executer les tests pytest
        run: |
          /tmp/x1000-audit-venv/bin/python \
            -m pytest tests \
            -v \
            -p no:cacheprovider

      - name: Verifier les fichiers proteges
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERREUR: fichiers modifies"
            git status --short
            exit 1
          fi

          echo "INTEGRITE DU DEPOT OK"

      - name: Conclusion
        if: success()
        run: |
          echo "AUDIT V73 REUSSI"
          echo "Aucun deploiement Render"
          echo "Aucun FIGE cree"
          echo "Aucune archive modifiee"
          echo "Validation PMU reelle non certifiee"
