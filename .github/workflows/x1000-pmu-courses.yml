name: X1000 PMU COURSES - Preparation V64

run-name: X1000 PMU COURSES V64 - Diagnostic protege

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-v64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: X1000 V64 - Diagnostic et integrite
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      X1000_PROJECT: x1000-pmu-courses
      X1000_VERSION: V64
      X1000_DIAGNOSTIC_ONLY: "1"
      X1000_DISABLE_WRITES: "1"
      X1000_DISABLE_BETS: "1"
      X1000_DISABLE_FIGE: "1"
      X1000_DISABLE_DEPLOY: "1"
      X1000_PRODUCTION_PORT: "8765"
      X1000_TEST_PORT: "18765"

    steps:
      - name: Recuperer le depot en lecture seule
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verifier le depot
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-pmu-courses"
          test -d .git
          python --version
          git rev-parse HEAD
          mkdir -p "$RUNNER_TEMP/x1000-v64"

      - name: Diagnostic V64 en lecture seule
        env:
          REPORT_DIR: ${{ runner.temp }}/x1000-v64
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          ROOT = pathlib.Path.cwd().resolve()
          OUT = pathlib.Path(
              os.environ["REPORT_DIR"]
          ).resolve()
          OUT.mkdir(parents=True, exist_ok=True)

          EXCLUDED = {
              ".git", ".venv", "venv",
              "__pycache__", ".pytest_cache",
              ".tox", "node_modules",
              ".mypy_cache"
          }

          PROTECTED = (
              "fige", "figé", "archive",
              "pronostic", "selection",
              "audit", "resultat"
          )

          EXPECTED_ROUTES = [
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits"
          ]

          CENTRAL_NAMES = {
              "central.py",
              "coordination_x1000.py",
              "integration_x1000.py",
              "coordinateur.py",
              "orchestrateur.py"
          }

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(
                      lambda: f.read(65536), b""
                  ):
                      h.update(chunk)
              return h.hexdigest()

          def inventory():
              result = {}
              for base, dirs, files in os.walk(
                  ROOT, followlinks=False
              ):
                  dirs[:] = [
                      d for d in dirs
                      if d not in EXCLUDED
                      and not (
                          pathlib.Path(base) / d
                      ).is_symlink()
                  ]
                  for name in files:
                      p = pathlib.Path(base) / name
                      if p.is_symlink() or not p.is_file():
                          continue
                      rel = p.relative_to(
                          ROOT
                      ).as_posix()
                      result[rel] = sha256(p)
              return result

          def is_protected(path):
              return any(
                  word in path.lower()
                  for word in PROTECTED
              )

          def git_command(*args):
              p = subprocess.run(
                  ["git", *args],
                  cwd=ROOT,
                  capture_output=True,
                  text=True,
                  check=False,
                  timeout=20
              )
              return {
                  "code": p.returncode,
                  "stdout": p.stdout[-2000:],
                  "stderr": p.stderr[-2000:]
              }

          before = inventory()
          protected_before = {
              k: v for k, v in before.items()
              if is_protected(k)
          }

          report = {
              "project": "X1000 PMU COURSES",
              "version": "V64",
              "timestamp_utc":
                  datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat(),
              "repository":
                  os.environ.get("GITHUB_REPOSITORY"),
              "mode": "static_read_only",
              "production_port": 8765,
              "production_port_touched": False,
              "engines": {},
              "central": {},
              "syntax": {},
              "api": {},
              "sources": {},
              "dependencies": {},
              "backup": {},
              "integrity": {},
              "rollback": {},
              "git": {},
              "warnings": [],
              "errors": []
          }

          report["git"]["before"] = git_command(
              "status", "--porcelain"
          )
          report["git"]["head"] = git_command(
              "rev-parse", "HEAD"
          )

          manifest = {
              "files": before,
              "protected": protected_before
          }

          manifest_path = OUT / "manifest.json"
          manifest_path.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True
              ),
              encoding="utf-8"
          )

          report["backup"] = {
              "type": "hash_manifest",
              "manifest_sha256": sha256(
                  manifest_path
              ),
              "full_backup": False,
              "protected_data_copied": False,
              "note":
                  "Inventaire SHA256 sans copie des donnees"
          }

          pyfiles = sorted(
              p for p in before
              if p.endswith(".py")
          )

          trees = {}

          for path in pyfiles:
              try:
                  source = (
                      ROOT / path
                  ).read_text(
                      encoding="utf-8-sig"
                  )
                  trees[path] = ast.parse(
                      source,
                      filename=path
                  )
                  report["syntax"][path] = "OK"
              except Exception as exc:
                  report["syntax"][path] = str(exc)
                  report["errors"].append(
                      "Syntaxe invalide: " + path
                  )

          for number in range(1, 6):
              name = f"M{number}"
              pattern = re.compile(
                  rf"(?<![a-z0-9])m{number}"
                  rf"(?![a-z0-9])",
                  re.IGNORECASE
              )

              candidates = [
                  p for p in pyfiles
                  if pattern.search(p)
              ]

              contracts = {}

              for path in candidates:
                  tree = trees.get(path)
                  if tree is None:
                      continue

                  functions = [
                      n.name for n in tree.body
                      if isinstance(
                          n,
                          (
                              ast.FunctionDef,
                              ast.AsyncFunctionDef
                          )
                      )
                  ]

                  classes = [
                      n.name for n in tree.body
                      if isinstance(
                          n, ast.ClassDef
                      )
                  ]

                  self_test = any(
                      isinstance(n, ast.Constant)
                      and n.value == "--self-test"
                      for n in ast.walk(tree)
                  )

                  contracts[path] = {
                      "functions": functions,
                      "classes": classes,
                      "self_test_declared": self_test
                  }

              report["engines"][name] = {
                  "candidates": candidates,
                  "status": (
                      "absent" if not candidates
                      else "candidate_unique"
                      if len(candidates) == 1
                      else "ambiguous"
                  ),
                  "contracts": contracts,
                  "executed": False,
                  "validated": False
              }

              if not candidates:
                  report["warnings"].append(
                      name + ": moteur non detecte"
                  )

          central = [
              p for p in pyfiles
              if pathlib.Path(
                  p
              ).name.lower() in CENTRAL_NAMES
          ]

          report["central"] = {
              "candidates": central,
              "status": (
                  "absent" if not central
                  else "candidate_unique"
                  if len(central) == 1
                  else "ambiguous"
              ),
              "executed": False,
              "validated": False
          }

          if not central:
              report["warnings"].append(
                  "Noyau central non detecte"
              )

          routes = {}
          asgi_candidates = []

          for path, tree in trees.items():
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      if any(
                          isinstance(t, ast.Name)
                          and t.id == "app"
                          for t in node.targets
                      ):
                          value = node.value
                          if isinstance(
                              value, ast.Call
                          ):
                              fn = value.func
                              if (
                                  isinstance(
                                      fn, ast.Name
                                  )
                                  and fn.id in {
                                      "FastAPI",
                                      "Starlette"
                                  }
                              ):
                                  asgi_candidates.append(
                                      path
                                  )

                  if not isinstance(
                      node,
                      (
                          ast.FunctionDef,
                          ast.AsyncFunctionDef
                      )
                  ):
                      continue

                  for dec in node.decorator_list:
                      if not isinstance(
                          dec, ast.Call
                      ):
                          continue
                      if not isinstance(
                          dec.func, ast.Attribute
                      ):
                          continue
                      if dec.func.attr not in {
                          "get", "post",
                          "put", "delete",
                          "patch", "route",
                          "api_route"
                      }:
                          continue
                      if not dec.args:
                          continue

                      arg = dec.args[0]
                      if (
                          isinstance(
                              arg, ast.Constant
                          )
                          and isinstance(
                              arg.value, str
                          )
                      ):
                          routes.setdefault(
                              arg.value, []
                          ).append({
                              "file": path,
                              "handler": node.name,
                              "method": dec.func.attr
                          })

          report["api"] = {
              "expected_routes": EXPECTED_ROUTES,
              "declared_routes": routes,
              "route_presence": {
                  route: route in routes
                  for route in EXPECTED_ROUTES
              },
              "asgi_candidates": sorted(
                  set(asgi_candidates)
              ),
              "http_tested": False,
              "asgi_tested": False,
              "note":
                  "Detection statique sans import ni serveur"
          }

          domains = set()
          domain_pattern = re.compile(
              r"https?://([a-zA-Z0-9.-]+)"
          )

          for path in pyfiles:
              content = (
                  ROOT / path
              ).read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              domains.update(
                  domain_pattern.findall(content)
              )

          report["sources"] = {
              "declared_domains": sorted(domains),
              "authorized_domains": [],
              "authorization_verified": False,
              "http_tested": False,
              "note":
                  "Aucun appel aux sources PMU"
          }

          manifests = sorted(
              p for p in before
              if (
                  pathlib.Path(p).name.startswith(
                      "requirements"
                  )
                  and p.endswith(".txt")
              )
              or pathlib.Path(p).name == (
                  "pyproject.toml"
              )
          )

          report["dependencies"] = {
              "manifests": manifests,
              "installed": False
          }

          after = inventory()

          changed = sorted(
              k for k in set(before) | set(after)
              if before.get(k) != after.get(k)
          )

          protected_after = {
              k: v for k, v in after.items()
              if is_protected(k)
          }

          protected_ok = (
              protected_before == protected_after
          )

          report["integrity"] = {
              "repository_unchanged":
                  before == after,
              "protected_unchanged":
                  protected_ok,
              "changed_files": changed,
              "files_before": len(before),
              "files_after": len(after)
          }

          report["rollback"] = {
              "required": bool(changed),
              "performed": False,
              "note":
                  "Aucune modification prevue; "
                  "aucun rollback destructif autorise"
          }

          report["git"]["after"] = git_command(
              "status", "--porcelain"
          )

          git_ok = (
              report["git"]["before"]
              == report["git"]["after"]
          )

          report["integrity"][
              "git_status_unchanged"
          ] = git_ok

          if not protected_ok:
              report["errors"].append(
                  "Integrite des donnees protegees violee"
              )

          if changed:
              report["errors"].append(
                  "Fichiers du depot modifies"
              )

          if not git_ok:
              report["errors"].append(
                  "Statut Git modifie"
              )

          report["result"] = (
              "PASS"
              if not report["errors"]
              else "FAIL"
          )

          report_path = OUT / "diagnostic.json"
          report_path.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True
              ),
              encoding="utf-8"
          )

          print(json.dumps({
              "version": "V64",
              "result": report["result"],
              "engines": {
                  k: v["status"]
                  for k, v in
                  report["engines"].items()
              },
              "central":
                  report["central"]["status"],
              "routes":
                  report["api"]["route_presence"],
              "protected_unchanged":
                  protected_ok,
              "repository_unchanged":
                  before == after,
              "warnings": report["warnings"],
              "errors": report["errors"]
          }, indent=2))

          if report["errors"]:
              sys.exit(1)
          PY

      - name: Verifier les empreintes des rapports
        env:
          REPORT_DIR: ${{ runner.temp }}/x1000-v64
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(
              os.environ["REPORT_DIR"]
          )
          manifest = root / "manifest.json"
          report = root / "diagnostic.json"

          assert manifest.is_file()
          assert report.is_file()

          data = json.loads(
              report.read_text(encoding="utf-8")
          )

          digest = hashlib.sha256(
              manifest.read_bytes()
          ).hexdigest()

          assert digest == data[
              "backup"
          ]["manifest_sha256"]

          assert data["integrity"][
              "protected_unchanged"
          ]
          assert data["integrity"][
              "repository_unchanged"
          ]
          assert data["integrity"][
              "git_status_unchanged"
          ]
          assert data["result"] == "PASS"

          print("V64: integrite confirmee")
          PY

      - name: Publier les rapports V64
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: x1000-pmu-courses-v64-diagnostic
          path: ${{ runner.temp }}/x1000-v64/
          if-no-files-found: warn
          retention-days: 7

      - name: Resume GitHub Actions
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/x1000-v64
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path(
              os.environ["REPORT_DIR"]
          ) / "diagnostic.json"

          lines = [
              "## X1000 PMU COURSES V64",
              "",
              "Mode : diagnostic statique protege",
              "",
              "- Aucun commit",
              "- Aucun push",
              "- Aucun deploiement",
              "- Aucun FIGE",
              "- Aucun pari",
              "- Port 8765 non touche",
              ""
          ]

          if path.exists():
              report = json.loads(
                  path.read_text(encoding="utf-8")
              )
              lines.append(
                  "Resultat : " + report["result"]
              )
              lines.append("")
              lines.append("### Moteurs")
              for name, item in report[
                  "engines"
              ].items():
                  lines.append(
                      "- " + name + ": "
                      + item["status"]
                  )
              lines.append("")
              lines.append(
                  "Noyau central : "
                  + report["central"]["status"]
              )
              lines.append("")
              lines.append("### Routes API")
              for route, found in report[
                  "api"
              ]["route_presence"].items():
                  lines.append(
                      "- " + route + ": "
                      + (
                          "detectee"
                          if found else "non detectee"
                      )
                  )
              lines.append("")
              lines.append(
                  "Donnees protegees intactes : "
                  + str(
                      report["integrity"][
                          "protected_unchanged"
                      ]
                  )
              )
              lines.append("")
              lines.append(
                  "Avertissements : "
                  + str(len(report["warnings"]))
              )
              lines.append(
                  "Erreurs : "
                  + str(len(report["errors"]))
              )
          else:
              lines.append(
                  "Rapport indisponible : "
                  "consulter les logs."
              )

          summary = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )
          if summary:
              with open(
                  summary, "a", encoding="utf-8"
              ) as f:
                  f.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))
          PY
