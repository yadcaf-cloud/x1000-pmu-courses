name: X1000 PMU COURSES - Preparation V63

run-name: X1000 PMU COURSES V63 - Diagnostic controle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/x1000-pmu-courses.yml"
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/x1000-pmu-courses.yml"
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: x1000-v63-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnostic X1000 V63
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      X1000_PROJECT: x1000-pmu-courses
      X1000_VERSION: V63
      X1000_PRODUCTION_PORT: "8765"
      X1000_TEST_PORT: "18765"
      X1000_DIAGNOSTIC_ONLY: "1"
      X1000_DISABLE_WRITES: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier le depot
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-pmu-courses"
          test -d .git
          python --version
          git status --short
          mkdir -p "$RUNNER_TEMP/x1000-v63"

      - name: Diagnostic complet V63
        env:
          REPORT_DIR: ${{ runner.temp }}/x1000-v63
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import socket
          import subprocess
          import sys

          ROOT = pathlib.Path.cwd().resolve()
          OUT = pathlib.Path(
              os.environ["REPORT_DIR"]
          )
          OUT.mkdir(parents=True, exist_ok=True)

          EXCLUDED = {
              ".git", ".venv", "venv",
              "__pycache__", ".pytest_cache",
              ".tox", "node_modules"
          }

          PROTECTED = (
              "fige", "figé", "archive",
              "pronostic", "selection",
              "audit", "resultat"
          )

          EXPECTED_ROUTES = [
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits"
          ]

          CENTRAL_NAMES = {
              "central.py",
              "coordination_x1000.py",
              "integration_x1000.py",
              "coordinateur.py",
              "orchestrateur.py"
          }

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(
                      lambda: stream.read(65536),
                      b""
                  ):
                      h.update(chunk)
              return h.hexdigest()

          def inventory():
              result = {}
              for directory, dirs, files in os.walk(
                  ROOT, followlinks=False
              ):
                  dirs[:] = [
                      d for d in dirs
                      if d not in EXCLUDED
                      and not (
                          pathlib.Path(directory) / d
                      ).is_symlink()
                  ]
                  for filename in files:
                      p = pathlib.Path(directory) / filename
                      if not p.is_file() or p.is_symlink():
                          continue
                      rel = p.relative_to(ROOT).as_posix()
                      result[rel] = sha256(p)
              return result

          def is_protected(name):
              return any(
                  word in name.lower()
                  for word in PROTECTED
              )

          def git(*args):
              p = subprocess.run(
                  ["git", *args],
                  cwd=ROOT,
                  capture_output=True,
                  text=True,
                  timeout=15,
                  check=False
              )
              return {
                  "code": p.returncode,
                  "stdout": p.stdout.strip(),
                  "stderr": p.stderr.strip()
              }

          before = inventory()
          protected_before = {
              k: v for k, v in before.items()
              if is_protected(k)
          }

          report = {
              "project": "X1000 PMU COURSES",
              "version": "V63",
              "timestamp_utc":
                  datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat(),
              "repository": os.environ.get(
                  "GITHUB_REPOSITORY"
              ),
              "mode": "diagnostic_read_only",
              "production_port": 8765,
              "production_port_tested": False,
              "temporary_port": 18765,
              "engines": {},
              "central": {},
              "syntax": {},
              "api": {},
              "sources": {},
              "dependencies": {},
              "integrity": {},
              "rollback": {},
              "git": {},
              "warnings": [],
              "errors": []
          }

          report["git"]["before"] = git(
              "status", "--porcelain"
          )
          report["git"]["head"] = git(
              "rev-parse", "HEAD"
          )

          # Analyse syntaxique
          pyfiles = sorted(
              p for p in before
              if p.endswith(".py")
          )
          trees = {}

          for path in pyfiles:
              try:
                  source = (ROOT / path).read_text(
                      encoding="utf-8-sig"
                  )
                  trees[path] = ast.parse(
                      source, filename=path
                  )
                  report["syntax"][path] = "OK"
              except Exception as exc:
                  report["syntax"][path] = str(exc)
                  report["errors"].append(
                      "Erreur syntaxe : " + path
                  )

          # Moteurs M1-M5
          for number in range(1, 6):
              name = f"M{number}"
              pattern = re.compile(
                  rf"(?<![a-z0-9])m{number}"
                  rf"(?![a-z0-9])",
                  re.IGNORECASE
              )

              candidates = [
                  p for p in pyfiles
                  if pattern.search(p)
              ]

              contracts = {}
              for path in candidates:
                  tree = trees.get(path)
                  if tree is None:
                      continue
                  contracts[path] = {
                      "functions": [
                          n.name for n in tree.body
                          if isinstance(
                              n,
                              (ast.FunctionDef,
                               ast.AsyncFunctionDef)
                          )
                      ],
                      "classes": [
                          n.name for n in tree.body
                          if isinstance(n, ast.ClassDef)
                      ]
                  }

              report["engines"][name] = {
                  "candidates": candidates,
                  "status": (
                      "absent" if not candidates
                      else "candidate_unique"
                      if len(candidates) == 1
                      else "ambiguous"
                  ),
                  "contracts": contracts,
                  "executed": False,
                  "validated": False
              }

          # Noyau central
          central = [
              p for p in pyfiles
              if pathlib.Path(p).name.lower()
              in CENTRAL_NAMES
          ]

          report["central"] = {
              "candidates": central,
              "status": (
                  "absent" if not central
                  else "candidate_unique"
                  if len(central) == 1
                  else "ambiguous"
              ),
              "executed": False,
              "validated": False
          }

          # Routes API
          routes = {}
          api_files = set()

          for path, tree in trees.items():
              for node in ast.walk(tree):
                  if not isinstance(
                      node,
                      (ast.FunctionDef,
                       ast.AsyncFunctionDef)
                  ):
                      continue

                  for dec in node.decorator_list:
                      if not isinstance(dec, ast.Call):
                          continue
                      if not isinstance(
                          dec.func, ast.Attribute
                      ):
                          continue
                      if dec.func.attr.lower() not in {
                          "get", "post", "put",
                          "delete", "patch",
                          "route", "api_route"
                      }:
                          continue
                      if not dec.args:
                          continue

                      arg = dec.args[0]
                      if (
                          isinstance(arg, ast.Constant)
                          and isinstance(arg.value, str)
                      ):
                          api_files.add(path)
                          routes.setdefault(
                              arg.value, []
                          ).append({
                              "file": path,
                              "handler": node.name,
                              "method": dec.func.attr
                          })

          report["api"] = {
              "files": sorted(api_files),
              "declared_routes": routes,
              "expected_routes": EXPECTED_ROUTES,
              "route_presence": {
                  r: r in routes
                  for r in EXPECTED_ROUTES
              },
              "http_tested": False,
              "asgi_tested": False,
              "reason":
                  "Contrat ASGI non valide; "
                  "aucun import applicatif dangereux"
          }

          # Sources hippiques declarees
          domains = set()
          domain_pattern = re.compile(
              r"https?://([a-zA-Z0-9.-]+)"
          )

          for path in pyfiles:
              content = (ROOT / path).read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              domains.update(
                  domain_pattern.findall(content)
              )

          report["sources"] = {
              "declared_domains": sorted(domains),
              "authorized_domains": [],
              "authorization_verified": False,
              "http_tested": False
          }

          # Dependances
          manifests = [
              p for p in before
              if (
                  pathlib.Path(p).name.startswith(
                      "requirements"
                  )
                  and p.endswith(".txt")
              )
              or pathlib.Path(p).name == (
                  "pyproject.toml"
              )
          ]

          report["dependencies"] = {
              "manifests": manifests,
              "installed": False
          }

          # Port temporaire uniquement
          try:
              with socket.socket(
                  socket.AF_INET,
                  socket.SOCK_STREAM
              ) as sock:
                  sock.bind(
                      ("127.0.0.1", 18765)
                  )
              report["api"]["temporary_port_ok"] = True
          except OSError as exc:
              report["api"]["temporary_port_ok"] = False
              report["warnings"].append(
                  "Port temporaire : " + str(exc)
              )

          # Integrite
          after = inventory()
          protected_after = {
              k: v for k, v in after.items()
              if is_protected(k)
          }

          protected_ok = (
              protected_before == protected_after
          )
          repository_ok = before == after

          report["integrity"] = {
              "protected_before": protected_before,
              "protected_after": protected_after,
              "protected_unchanged": protected_ok,
              "repository_unchanged": repository_ok,
              "files_before": len(before),
              "files_after": len(after)
          }

          report["rollback"] = {
              "required": False,
              "performed": False,
              "reason":
                  "Aucune ecriture dans le depot"
          }

          report["git"]["after"] = git(
              "status", "--porcelain"
          )

          if not protected_ok:
              report["errors"].append(
                  "Integrite des donnees protegees"
              )

          if not repository_ok:
              report["errors"].append(
                  "Depot modifie pendant le diagnostic"
              )

          # Rapport JSON
          output = OUT / "rapport-v63.json"
          output.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          (OUT / "rapport-v63.sha256").write_text(
              sha256(output)
              + "  rapport-v63.json\n",
              encoding="utf-8"
          )

          print("=== X1000 PMU COURSES V63 ===")

          for name, data in report["engines"].items():
              print(name, data["status"])

          print(
              "CENTRAL:",
              report["central"]["status"]
          )

          for route, present in (
              report["api"]["route_presence"].items()
          ):
              print(
                  route,
                  "DECLAREE" if present
                  else "NON DETECTEE"
              )

          print(
              "INTEGRITE:",
              protected_ok
          )
          print(
              "DEPOT INCHANGE:",
              repository_ok
          )
          print(
              "PORT PRODUCTION:",
              "8765 preserve"
          )
          print(
              "RAPPORT:",
              output
          )

          if report["errors"]:
              for error in report["errors"]:
                  print("::error::" + error)
              sys.exit(1)

          print("DIAGNOSTIC V63 TERMINE")
          PY

      - name: Publier les rapports V63
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-pmu-courses-v63
          path: ${{ runner.temp }}/x1000-v63/
          if-no-files-found: warn
          retention-days: 14

      - name: Resume V63
        if: always()
        run: |
          {
            echo "## X1000 PMU COURSES V63"
            echo ""
            echo "- Depot : x1000-pmu-courses"
            echo "- Python : 3.11"
            echo "- M1 a M5 : diagnostic statique"
            echo "- Central : diagnostic statique"
            echo "- API : inventaire de cinq routes"
            echo "- HTTP : en attente de contrat sur"
            echo "- PMU : inventaire des sources"
            echo "- Port 8765 : preserve"
            echo "- Pronostics : preserves"
            echo "- FIGEs : preserves"
            echo "- Archives : preservees"
            echo "- Integrite : SHA-256"
            echo "- Rapport : JSON"
            echo "- Commit automatique : aucun"
            echo "- Push automatique : aucun"
            echo "- Deploiement : aucun"
          } >> "$GITHUB_STEP_SUMMARY"
